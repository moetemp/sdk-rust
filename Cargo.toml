[workspace]
members = [
    "crates/sdk-core",
    "crates/client",
    "crates/common",
    "crates/common-wasm",
    "crates/protos",
    "crates/macros",
    "crates/sdk",
    "crates/workflow",
    "crates/streams",
    "crates/sdk-core-c-bridge",
    "crates/changelog-release-notes",
]
resolver = "3"

[workspace.package]
license = "MIT"
license-file = "LICENSE.txt"

[workspace.dependencies]
bon = { version = "3", default-features = false, features = ["alloc", "implied-bounds"] }
derive_more = { version = "2.0", default-features = false, features = [
    "constructor",
    "display",
    "from",
    "into",
    "debug",
    "try_into",
] }
thiserror = "2"
tonic = { version = "0.14.6", default-features = false }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }
prost = "0.14"
prost-types = { version = "0.7", package = "prost-wkt-types" }
pbjson = "0.9"
pbjson-build = "0.9"
serde_json = "1.0"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

# `temporalio-streams-redis` isn't on crates.io yet, so the C bridge's optional dependency on it
# comes from git. Its own dependencies on the Stream and common crates take this workspace's copies.
[patch.crates-io]
temporalio-common = { path = "crates/common" }
temporalio-streams = { path = "crates/streams" }

[patch.crates-io.temporalio-streams-redis]
git = "https://github.com/temporal-community/sdk-streams"
rev = "21cc10b3372a84b5c0f3c669a28a20c335214879"

[profile.release-lto]
inherits = "release"
lto = true
