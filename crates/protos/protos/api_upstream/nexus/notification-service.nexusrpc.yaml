# yaml-language-server: $schema=https://raw.githubusercontent.com/nexus-rpc/nexus-rpc-gen/main/schemas/nexus-rpc-gen.json
#
# Nexus service that a Worker implements to take NexusHandler callbacks.
# See temporal/api/notificationservice/v1/request_response.proto for the messages.
#
# The server calls OnComplete for the callback's `operation` and OnProgress for its
# `progress_operation`. Both operations complete synchronously.

nexusrpc: 1.0.0

services:
  temporal.api.notificationservice.v1.NotificationService:
    description: >
      Receives the completion and the progress of a source operation, such as a standalone Nexus
      operation, on a Worker.
    operations:
      OnComplete:
        description: Receives the completion of the source operation. Called once.
        input:
          $dotnetRef: Temporalio.Api.NotificationService.V1.OnCompleteRequest
          $goRef: go.temporal.io/api/notificationservice/v1.OnCompleteRequest
          $javaRef: io.temporal.api.notificationservice.v1.OnCompleteRequest
          $pythonRef: temporalio.api.notificationservice.v1.OnCompleteRequest
          $rubyRef: Temporalio::Api::NotificationService::V1::OnCompleteRequest
          $typescriptRef: '@temporalio/api/notificationservice/v1.OnCompleteRequest'
        output:
          $dotnetRef: Temporalio.Api.NotificationService.V1.OnCompleteResponse
          $goRef: go.temporal.io/api/notificationservice/v1.OnCompleteResponse
          $javaRef: io.temporal.api.notificationservice.v1.OnCompleteResponse
          $pythonRef: temporalio.api.notificationservice.v1.OnCompleteResponse
          $rubyRef: Temporalio::Api::NotificationService::V1::OnCompleteResponse
          $typescriptRef: '@temporalio/api/notificationservice/v1.OnCompleteResponse'
      OnProgress:
        description: Receives the progress of the source operation. Called any number of times, in any order relative to OnComplete.
        input:
          $dotnetRef: Temporalio.Api.NotificationService.V1.OnProgressRequest
          $goRef: go.temporal.io/api/notificationservice/v1.OnProgressRequest
          $javaRef: io.temporal.api.notificationservice.v1.OnProgressRequest
          $pythonRef: temporalio.api.notificationservice.v1.OnProgressRequest
          $rubyRef: Temporalio::Api::NotificationService::V1::OnProgressRequest
          $typescriptRef: '@temporalio/api/notificationservice/v1.OnProgressRequest'
        output:
          $dotnetRef: Temporalio.Api.NotificationService.V1.OnProgressResponse
          $goRef: go.temporal.io/api/notificationservice/v1.OnProgressResponse
          $javaRef: io.temporal.api.notificationservice.v1.OnProgressResponse
          $pythonRef: temporalio.api.notificationservice.v1.OnProgressResponse
          $rubyRef: Temporalio::Api::NotificationService::V1::OnProgressResponse
          $typescriptRef: '@temporalio/api/notificationservice/v1.OnProgressResponse'
