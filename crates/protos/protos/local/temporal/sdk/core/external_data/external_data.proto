syntax = "proto3";

package coresdk.external_data;
option ruby_package = "Temporalio::Internal::Bridge::Api::ExternalData";

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// This file defines data that Core might write externally. The first motivating case being
// storing data in markers in event history. Defining such data as protos provides an easy way
// for consumers which would like to just depend on the proto package to make sense of marker data.

message LocalActivityMarkerData {
  uint32 seq = 1;
  // The number of attempts at execution before we recorded this result. Typically starts at 1,
  // but it is possible to start at a higher number when backing off using a timer.
  uint32 attempt = 2;
  string activity_id = 3;
  string activity_type = 4;
  // You can think of this as "perceived completion time". It is the time the local activity thought
  // it was when it completed. Which could be different from wall-clock time because of workflow
  // replay. It's the WFT start time + the LA's runtime
  google.protobuf.Timestamp complete_time = 5;
  // If set, this local activity conceptually is retrying after the specified backoff.
  // Implementation wise, they are really two different LA machines, but with the same type & input.
  // The retry starts with an attempt number > 1.
  google.protobuf.Duration backoff = 6;
  // The time the LA was originally scheduled (wall clock time). This is used to track
  // schedule-to-close timeouts when timer-based backoffs are used
  google.protobuf.Timestamp original_schedule_time = 7;
  // Position, within the workflow task, of the activation this resolution was delivered in.
  // Replay must deliver resolutions in the same activations because workflow code can branch on
  // which handles are ready. Absent in markers written by Core versions that predate this field.
  optional uint64 activation_index = 8;
}

message PatchedMarkerData {
  // The patch id
  string id = 1;
  // Whether or not the patch is marked deprecated.
  bool deprecated = 2;
}

// The data of a `core_stream` marker. Core records one in each Workflow Task in which Workflow
// code got a Stream result or asked for a close. The marker has these details.
// * `data` holds this message as JSON, with each `bytes` field in lower-case hex.
// * `records` has the body of each Record of the reads with `records_in_history`, one payload for
//   each. They're in the order of `reads`, and those of one read in the order of its Stream. It's
//   absent if the marker has no such Record.
// * `record_info` has one `binary/plain` payload with the rest of each of those Records, in the
//   same order. Each is its `temporal.api.stream.v1.StreamRecord` with no body, with its length
//   before it as a varint. It's absent if `records` is.
//
// Every later version of Core must read the markers in History, so these rules apply to each
// message of the marker.
// * A field never changes its name, because the name is its key in the JSON.
// * A new field is `optional`, because older markers don't have it.
// * A new `repeated` field gets `#[serde(default)]` in `build.rs`, for the same reason.
message StreamMarkerData {
  repeated StreamCloseIntent close_intents = 1;
  repeated StreamAppendResult appends = 2;
  repeated StreamCloseResult closes = 3;
  repeated StreamReadResult reads = 4;
}

message StreamCloseIntent {
  uint32 seq = 1;
  string stream_id = 2;
  // The Store name of the Stream's ref.
  string store = 3;
}

message StreamAppendResult {
  uint32 seq = 1;
  string stream_id = 2;
  // The Store name of the Stream's ref.
  string store = 3;
  // The index of the activation, within its Workflow Task, in which Workflow code got the result.
  uint64 activation_index = 4;
  oneof result {
    StreamAppendOffsets appended = 5;
    StreamFailure failure = 6;
  }
}

message StreamAppendOffsets {
  bytes first_offset = 1;
  bytes last_offset = 2;
}

// Why a Stream call failed. Core builds the failure that Workflow code gets from these two.
message StreamFailure {
  // The name of the `temporal.api.enums.v1.StreamErrorReason`, such as
  // `STREAM_ERROR_REASON_CLOSED`. History stores the name, so a reason must never change its name.
  string reason = 1;
  // The message of the failure, of at most 4096 bytes.
  string message = 2;
}

message StreamCloseResult {
  uint32 seq = 1;
  // The index of the activation, within its Workflow Task, in which Workflow code got the result.
  uint64 activation_index = 2;
  // Unset if the Stream is closed.
  StreamFailure failure = 3;
}

message StreamReadResult {
  uint32 seq = 1;
  string stream_id = 2;
  // The Store name of the Stream's ref.
  string store = 3;
  // The index of the activation, within its Workflow Task, in which Workflow code got the result.
  uint64 activation_index = 4;
  // The `from_offset` of the read. A replay reads the Records of a page after it.
  bytes from_offset = 5;
  oneof result {
    StreamReadPage page = 6;
    StreamFailure failure = 7;
    // Workflow code cancelled the read before it got the job of the read.
    google.protobuf.Empty cancelled = 8;
  }
}

// A page that a read gave Workflow code.
message StreamReadPage {
  // The number of Records in the page.
  uint32 record_count = 1;
  // True if the Stream was closed and had no Record after this page.
  bool done = 2;
  // The first 16 bytes of the SHA-256 of the Records. It's empty for a read with
  // `records_in_history`, whose Records are in the details of the marker, or if the page has no
  // Record.
  bytes digest = 3;
  // The bytes of the Records, each as a page of a read encodes it, with the tag and the length of
  // its field. That is the measure of the `max_bytes` of a read. It's set when `digest` is, so a
  // replay knows how much it reads.
  uint64 record_bytes = 4;
}
