[package]
name = "temporalio-streams"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = { workspace = true }
description = "The experimental Stream runtime that Temporal SDK bridges link"
homepage = "https://temporal.io/"
repository = "https://github.com/temporalio/sdk-rust"
keywords = ["temporal", "workflow", "streams"]
categories = ["development-tools"]

[features]
# The shared suites, for the crates of other Stores.
test-support = ["dep:futures-util", "dep:serde_json"]

[dependencies]
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
parking_lot = "0.12"
prost = { workspace = true }
prost-types = { workspace = true }
serde_json = { workspace = true, optional = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { version = "1.47", default-features = false, features = ["rt", "sync", "time"] }
tonic = { workspace = true }

[dependencies.temporalio-common]
path = "../common"
version = "~1.1.0"
default-features = false

[build-dependencies]
prost = { workspace = true }
protox = "0.9.1"
tonic-prost-build = { workspace = true }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = { workspace = true }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
