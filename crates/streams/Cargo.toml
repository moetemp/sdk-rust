[package]
name = "temporalio-streams"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = { workspace = true }
description = "Stream stores for Temporal Workflows: the store trait, cursors and record helpers"
homepage = "https://temporal.io/"
repository = "https://github.com/temporalio/sdk-rust"
keywords = ["temporal", "workflow", "streams"]
categories = ["development-tools"]

[features]
default = []
# The Redis store. Off by default, so a build that needs only the trait takes no Redis client.
redis = []

[dependencies]
async-trait = "0.1"
prost = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }

[dependencies.temporalio-common]
path = "../common"
version = "~1.1.0"
default-features = false

[lints]
workspace = true
