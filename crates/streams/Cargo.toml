[package]
name = "temporalio-streams"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = { workspace = true }
description = "The experimental Stream runtime that Temporal SDK bridges link"
homepage = "https://temporal.io/"
repository = "https://github.com/temporalio/sdk-rust"
keywords = ["temporal", "workflow", "streams"]
categories = ["development-tools"]

[dependencies]
async-trait = "0.1"
prost = { workspace = true }
prost-types = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { version = "1.47", default-features = false, features = ["rt", "sync", "time"] }
tonic = { workspace = true }

[dependencies.temporalio-common]
path = "../common"
version = "~1.1.0"
default-features = false

# Only for its descriptor set, which the build script reads for the API protos that the Stream
# protos import.
[dependencies.temporalio-protos]
path = "../protos"
version = "~0.10.0"

[build-dependencies]
protox = "0.9.1"
tonic-prost-build = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
