syntax = "proto3";

// The crate's own calls. Lang sends an asynchronous method through `call`, a synchronous one
// through `call_sync`, and a static one through `call_static`. Field numbers are the contract.
package temporal.sdk.streams.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "temporal/api/enums/v1/stream.proto";
import "temporal/api/stream/v1/message.proto";
import "temporal/api/streamservice/v1/request_response.proto";

// The settings of the memory Stream runtime, for tests. Each field has the number of the same
// field in the config of the other Stores, such as Redis, so a backend can send that config here
// too.
message MemoryStreamConfig {
    // The default Retention of a new Stream. Empty is 7 days.
    google.protobuf.Duration retention = 4;
    // How long an open Workflow-owned Stream stays after its last write. Empty is 90 days.
    google.protobuf.Duration safety_ttl = 5;
    // The backend name that lang registered this runtime under. The crate sets it on each
    // StreamRef that it builds, such as the one in a create response.
    string backend = 10;
}

// Method `OpenWriter`, asynchronous. A writer for an Activity, a Local Activity or a client
// Producer, which keeps its epoch and `sequence` order. A writer of a Local Activity, or of an
// Activity attempt above 1, first sends an empty batch, so that the new epoch withdraws the earlier
// one's Records. The handles of one Producer epoch on one Stream share one writer. Each open adds a
// handle, and each `CloseWriter` or `FreeWriter` releases one. The batches of every writer in a
// process take their `sequence` from one counter, so a writer that opens again after its close
// continues above its earlier batches.
message OpenWriterRequest {
    string namespace = 1;
    temporal.api.stream.v1.StreamRef stream = 2;
    temporal.api.stream.v1.Producer producer = 3;
    // A write sends at most this many Records in one batch. Zero is 1000.
    int32 max_batch_size = 5;
    // How long a write retries a Store failure. Empty is 10 s.
    google.protobuf.Duration max_retry_duration = 6;
    // Local Activity only. The run's task facts, which each batch sends as AppendRecords does, so
    // the writes withdraw the run's orphaned Local Activity Records.
    temporal.api.stream.v1.WorkflowTaskEpoch previous_completed_task = 8;
    repeated int64 failed_tasks = 9;
}

message OpenWriterResponse {
    uint64 writer_id = 1;
}

// Method `WriteRecords`, asynchronous. Appends Records at once for an open writer and responds when
// the Store has them. It uses the writer's Producer epoch and `sequence` order. After a Store
// failure it resends the same batch, so that the Store writes it once. Records past the Store's
// batch limit go in more batches, in order. An awaited publish of an Activity or a client uses this
// call. A Store failure after the retries fails only that write, and the next write takes a higher
// `sequence`. Any other failure fails the writer.
message WriteRecordsRequest {
    uint64 writer_id = 1;
    repeated temporal.api.stream.v1.AppendRecord records = 2;
}

message WriteRecordsResponse {
    // The offsets of the first and the last Record. Zero when the request has no Record.
    int64 first_offset = 1;
    int64 last_offset = 2;
}

// Method `CloseWriter`, asynchronous. Releases one handle of the writer. The last handle waits for
// a write in flight, then drops the writer. It doesn't close the Stream. It fails with the
// writer's error if the writer failed.
message CloseWriterRequest {
    uint64 writer_id = 1;
}

message CloseWriterResponse {
    // The offset of the newest Record the writer wrote. Zero if it wrote none.
    int64 last_offset = 1;
}

// Method `FreeWriter`, synchronous. Releases one handle of the writer with no wait, such as from a
// finalizer. A write in flight still completes, and the writer's error is lost.
message FreeWriterRequest {
    uint64 writer_id = 1;
}

message FreeWriterResponse {
}

// Method `CloseWriters`, asynchronous. Drops every open writer, for example when the backend's
// client or Worker shuts down.
message CloseWritersRequest {
}

message CloseWritersResponse {
    // The writers that had failed.
    int32 failed = 1;
}

// The Workflow Task that dispatched a Local Activity. It has the field numbers and types of Core's
// `coresdk.activity_task.WorkflowTaskAttempt`, so lang passes those bytes as they are.
message WorkflowTaskAttempt {
    int64 started_event_id = 1;
    uint32 attempt = 2;
    google.protobuf.Timestamp started_time = 3;
    // The run's last completed task, 0 when no task completed.
    int64 previous_started_event_id = 4;
    repeated int64 failed_tasks = 5;
    uint32 previous_attempt = 6;
    google.protobuf.Timestamp previous_started_time = 7;
}

// The Activity attempt that writes or reads. Lang copies it from its Activity info.
message ActivityContext {
    bool is_local = 1;
    // True for an Activity that a Workflow scheduled, false for a Standalone Activity.
    bool in_workflow = 2;
    string workflow_id = 3;
    string workflow_run_id = 4;
    string activity_id = 5;
    // Standalone Activity only.
    string activity_run_id = 6;
    int32 attempt = 7;
    google.protobuf.Timestamp current_attempt_scheduled_time = 8;
    // The value of the `__temporal_stream_key` header. Empty when the header is absent.
    string call_key = 9;
    // Local Activity only. Core's `Start.workflow_task`.
    WorkflowTaskAttempt workflow_task = 10;
}

enum ProducerPurpose {
    PRODUCER_PURPOSE_UNSPECIFIED = 0;
    // The create and append Local Activities of Workflow code. Every attempt in one Workflow Task
    // writes at attempt 1, so the Store dedupes a retry.
    PRODUCER_PURPOSE_WORKFLOW_WRITE = 1;
    // An Activity's own writes. A higher attempt withdraws the earlier attempts' Records.
    PRODUCER_PURPOSE_ACTIVITY_WRITER = 2;
}

// Method `DeriveProducer`, static. The Producer of an Activity attempt, by the one rule of every
// SDK. It refuses a Local Activity with no `workflow_task`.
message DeriveProducerRequest {
    ActivityContext context = 1;
    ProducerPurpose purpose = 2;
}

message DeriveProducerResponse {
    temporal.api.stream.v1.Producer producer = 1;
    // Local Activity only. Each batch sends them, so the Store withdraws the run's orphaned Local
    // Activity Records. The task is always set, with 0 before the run's first completed task.
    temporal.api.stream.v1.WorkflowTaskEpoch previous_completed_task = 2;
    repeated int64 failed_tasks = 3;
}

// Method `ScopedStreamId`, static. The id of a Stream that a Workflow creates with a name, for code
// outside a Workflow. Workflow code builds the same id itself.
message ScopedStreamIdRequest {
    string workflow_id = 1;
    string first_execution_run_id = 2;
    string name = 3;
}

message ScopedStreamIdResponse {
    string id = 1;
}

// Method `OpenActivityScope`, asynchronous. Opens the scope of one Activity attempt, which writes
// as the Producer of `DeriveProducer`, with one writer for each Stream. `CloseScope` ends it.
message OpenActivityScopeRequest {
    string namespace = 1;
    ActivityContext context = 2;
    // The Streams in the attempt's arguments. From attempt 2, the open withdraws the earlier
    // attempts' Records on each. A missing, closed or expired Stream doesn't fail it.
    repeated temporal.api.stream.v1.StreamRef streams = 3;
}

// Method `OpenClientScope`, synchronous. Opens the scope of the client Producer `client:<name>` at
// `epoch`, or with no name `client:<identity>:<key>` at epoch 1, with a new key for each scope.
message OpenClientScopeRequest {
    string namespace = 1;
    string identity = 2;
    string name = 3;
    // 1 or more, with a name only.
    int32 epoch = 4;
}

message OpenScopeResponse {
    uint64 scope_id = 1;
    temporal.api.stream.v1.Producer producer = 2;
}

// Method `Publish`, asynchronous. Appends Records as the scope's Producer and answers when the
// Store has them. The first publish to a Stream opens the scope's writer, as `OpenWriter` does.
message PublishRequest {
    uint64 scope_id = 1;
    temporal.api.stream.v1.StreamRef stream = 2;
    // The bodies are in their stored form, after lang's converter and codec.
    repeated temporal.api.stream.v1.AppendRecord records = 3;
}

message PublishResponse {
    // The offsets of the first and the last Record. Zero when the request has no Record.
    int64 first_offset = 1;
    int64 last_offset = 2;
}

// Method `CloseStreamAs`, asynchronous, with `CloseStreamResponse`. Closes the scope's writer for
// the Stream, then the Stream, as the scope's Producer. An Activity scope fails with NOT_OWNER.
message CloseStreamAsRequest {
    uint64 scope_id = 1;
    // The runtime sets `namespace` and `producer` from the scope. Payloads are in their stored
    // form.
    temporal.api.streamservice.v1.CloseStreamRequest close = 2;
}

// Method `CloseScope`, asynchronous. Closes every writer of the scope and frees it. A failed
// writer doesn't fail the call. The response counts it instead.
message CloseScopeRequest {
    uint64 scope_id = 1;
}

message CloseScopeResponse {
    int32 failed_writers = 1;
    // The first failure, if any.
    StreamFailure failure = 2;
}

// A failure that a response reports, as lang raises it from a failed call.
message StreamFailure {
    temporal.api.enums.v1.StreamErrorReason reason = 1;
    string message = 2;
}

// Method `FreeScope`, synchronous. Frees the scope and releases its writers with no wait, such as
// from a finalizer. A write in flight still completes.
message FreeScopeRequest {
    uint64 scope_id = 1;
}

// The response of `FreeScope` and the other `Free` methods, which do nothing once a shutdown ended.
message FreeResponse {
}

// Method `Shutdown`, asynchronous. Closes every scope and writer, for the backend's shutdown. Then
// only `Shutdown`, the static and the `Free` methods run. A dropped one runs again.
message ShutdownRequest {
}

message ShutdownResponse {
    int32 failed_writers = 1;
}
